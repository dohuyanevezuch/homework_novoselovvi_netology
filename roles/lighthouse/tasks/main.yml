---
- name: Установка nginx и архиватора
  ansible.builtin.apt:
    name: "{{ lighthouse_packages }}"
    state: present
    update_cache: true
  tags:
    - packages

- name: Скачивание lighthouse архива
  ansible.builtin.get_url:
    url: "{{ lighthouse_archive_url }}"
    dest: "{{ lighthouse_archive_path }}"
    mode: "0644"
  tags:
    - download

- name: Создание директории lighthouse
  ansible.builtin.file:
    path: "{{ lighthouse_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  tags:
    - config

- name: Извлечение архива lighthouse
  ansible.builtin.unarchive:
    src: "{{ lighthouse_archive_path }}"
    dest: "{{ lighthouse_root }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
      - --no-same-owner
    owner: www-data
    group: www-data
    creates: "{{ lighthouse_root }}/index.html"
  notify: Reload Nginx
  tags:
    - download
    - config

- name: Nginx конфигурация
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: /etc/nginx/sites-available/lighthouse.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx
  tags:
    - config

- name: Использование lighthouse сайта в nginx
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lighthouse.conf
    dest: /etc/nginx/sites-enabled/lighthouse.conf
    state: link
  notify: Reload Nginx
  tags:
    - config

- name: Отключение дефолтного сайта в nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx
  tags:
    - config

- name: Проверка конфигурации nginx
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  tags:
    - config

- name: Активация и перезапуск nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
  tags:
    - service
